# Stack da VPS — ETAPA 1: aplicação no ar, sem túnel e sem TLS.
#
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Diferenças para o docker-compose.yml (que é o alvo final, com túnel):
#   - a api tem rede Docker normal, em vez de emprestar o netns do wireguard;
#   - só o frontend publica porta (80). Banco e api ficam fechados na rede
#     interna: quem fala com a api de fora é o nginx do frontend.
#
# Consequência esperada nesta etapa: nenhum equipamento responde e o status do
# túnel é sempre "offline" — não existe WireGuard ainda. O objetivo aqui é só
# logar e ver as telas.
#
# Quando o túnel entrar, esta stack sai e o alvo passa a ser:
#   docker compose -f docker-compose.vps.yml down
#   docker compose -f vpn-gateway/docker-compose.yml up -d
#   docker compose up -d
# Nome fixo do projeto: o padrão seria o nome da pasta, e aí renomear ou
# reclonar o repo criaria volume novo (banco vazio).
name: solarpulse

services:
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=religamento
    volumes:
      - db_data:/var/lib/postgresql/data
    # sem "ports": o banco não fica exposto na internet
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d religamento"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: api
    # sem "ports": alcançável só pela app_net, via nginx do frontend
    networks:
      - app_net
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - app_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  app_net:
    name: app_net

volumes:
  db_data:
