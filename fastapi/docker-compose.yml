# Stack "religamento" — depende da stack "vpn-gateway" já estar de pé
# (o container "wireguard" precisa existir antes, pois a api usa
# network_mode: "container:wireguard"). Suba nesta ordem:
#   docker compose -f vpn-gateway/docker-compose.yml up -d
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=religamento
    volumes:
      - db_data:/var/lib/postgresql/data
    # 5433 no host pra não colidir com um Postgres local na 5432;
    # útil pra rodar alembic fora do container durante o desenvolvimento
    ports:
      - "5433:5432"
    networks:
      - app_net
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: api
    # sem rede própria: empresta 100% o netns do container "wireguard"
    # (stack vpn-gateway), é assim que alcança os IPs das usinas via túnel
    network_mode: "container:wireguard"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    networks:
      - app_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  app_net:
    external: true

volumes:
  db_data:
