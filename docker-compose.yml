# Stack "religamento" — depende da stack "vpn-gateway" já estar de pé
# (o container "wireguard" precisa existir antes, pois a api usa
# network_mode: "container:wireguard"). Suba nesta ordem:
#   docker compose -f vpn-gateway/docker-compose.yml up -d
#   docker compose up -d
# Nome fixo do projeto: o padrão seria o nome da pasta, e aí renomear ou
# reclonar o repo criaria volume novo (banco vazio).
name: solarpulse

services:
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=religamento
    volumes:
      - db_data:/var/lib/postgresql/data
    # sem "ports": o banco não fica exposto na internet — o "ufw" não filtra
    # portas publicadas pelo Docker (ele injeta regras de iptables que passam
    # na frente), então publicar aqui seria expor Postgres com senha padrão
    # pra internet inteira. Pra rodar alembic/psql à mão, use
    # "docker compose exec db ..." em vez de conectar do host.
    networks:
      - app_net
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: api
    # sem rede própria: empresta 100% o netns do container "wireguard"
    # (stack vpn-gateway), é assim que alcança os IPs das usinas via túnel
    network_mode: "container:wireguard"
    # Compartilhar o netns NÃO compartilha capabilities, e a interface netlink
    # do WireGuard exige NET_ADMIN mesmo só para ler. Sem isto, `wg show`
    # responde "Operation not permitted" e o status do túnel nunca funciona.
    cap_add:
      - NET_ADMIN
    depends_on:
      - db
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - app_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  app_net:
    external: true

volumes:
  db_data:
