services:
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      app_net:
        aliases:
          - api
    ports:
      # porta do túnel: é por aqui que os peers das usinas conectam.
      # Precisa estar liberada no firewall da VPS (e no painel do provedor).
      - "51820:51820/udp"
      # A api roda em network_mode: "container:wireguard", então a 8000 do
      # uvicorn aparece aqui. Presa no loopback de propósito: quem fala com
      # ela é o nginx do frontend, pela app_net. Aberta, seria a API inteira
      # exposta na internet.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

networks:
  app_net:
    name: app_net
